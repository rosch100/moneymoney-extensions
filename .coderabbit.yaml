# CodeRabbit — MoneyMoney Extensions
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# Voraussetzung: GitHub-App „CodeRabbit“ für dieses Repo installieren:
# https://github.com/apps/coderabbitai/installations/new

language: de-DE

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!**/node_modules/**"
    - "!**/__pycache__/**"
    - "!**/.venv/**"
    - "!**/xcuserdata/**"
    - "!**/DerivedData/**"
    - "!**/*.har"
    - "!**/Amazon-MoneyMoney/**"
    - "!**/Bank-of-America-MoneyMoney/**"
    - "!**/Fidelity-MoneyMoney/**"
    - "!**/MLP-Versicherungen-MoneyMoney/**"
    - "!**/Presidential-Bank-MoneyMoney/**"
    - "!**/Shareview-MoneyMoney/**"

  tools:
    opengrep:
      enabled: true

chat:
  auto_reply: true

name: Extension tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-and-validate:
    name: Test & syntax checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Lua 5.4 liegt in der im rockspec geforderten Spanne (>=5.1, <5.5)
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.4"
          buildCache: "false"

      - name: Lua unit tests
        run: |
          set -euo pipefail
          files="$(git ls-files 'tests/*.lua')"
          if [ -z "${files}" ]; then
            echo "No Lua tests tracked."
            exit 0
          fi
          while IFS= read -r file; do
            lua "$file"
          done <<< "${files}"

      - name: Lua syntax check (all tracked .lua)
        run: |
          set -euo pipefail
          files="$(git ls-files '*.lua')"
          if [ -z "${files}" ]; then
            echo "No Lua files tracked."
            exit 0
          fi
          while IFS= read -r file; do
            lua -e "assert(loadfile('$file'))"
          done <<< "${files}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          set -euo pipefail
          files="$(git ls-files '*.py')"
          if [ -z "${files}" ]; then
            echo "No Python files tracked."
            exit 0
          fi
          while IFS= read -r file; do
            python3 -m py_compile "$file"
          done <<< "${files}"

      - name: Python unit tests (tracked tests/*.py)
        run: |
          set -euo pipefail
          files="$(git ls-files 'tests/*.py')"
          if [ -z "${files}" ]; then
            echo "No Python tests tracked."
            exit 0
          fi
          while IFS= read -r f; do
            python3 "$f"
          done <<< "${files}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: JavaScript unit tests (cookie export)
        run: node tests/test_cookie_export.mjs

      - name: JavaScript parse check (tracked .js)
        run: |
          set -euo pipefail
          files="$(git ls-files '*.js')"
          if [ -z "${files}" ]; then
            echo "No JavaScript files tracked."
            exit 0
          fi
          while IFS= read -r file; do
            node --check "$file"
          done <<< "${files}"

